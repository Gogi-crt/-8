<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Проверка пропуска — Бюро научных приключений</title>
<style>
body{font-family:Arial,sans-serif;background:#f3f6f4;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;color:#17352b}
.card{background:white;max-width:560px;width:92%;padding:34px;border-radius:22px;box-shadow:0 12px 40px #0001;text-align:center}
h1{font-size:24px;margin:0 0 8px} .sub{color:#66736d;margin-bottom:25px}
input{width:100%;box-sizing:border-box;padding:14px;border:1px solid #ccd6d1;border-radius:12px;font-size:18px}
button{margin-top:12px;width:100%;padding:14px;border:0;border-radius:12px;background:#17352b;color:white;font-size:17px;cursor:pointer}
.result{margin-top:22px;padding:20px;border-radius:16px;background:#eef7f0}
.valid{color:#176b35;font-weight:700;font-size:24px} .invalid{color:#a52a2a;font-weight:700;font-size:22px}
.small{margin-top:12px;color:#66736d;font-size:14px}
</style>
</head>
<body><div class="card">
<h1>БЮРО НАУЧНЫХ ПРИКЛЮЧЕНИЙ</h1>
<div class="sub">Проверка пропуска проверяющего</div>
<input id="id" placeholder="BNA-CHK-001" autocomplete="off">
<button onclick="check()">Проверить пропуск</button>
<div id="result"></div>
<div class="small">Для каждого пропуска используется индивидуальный QR-код.</div>
</div>
<script>
const valid=["BNA-CHK-001", "BNA-CHK-002", "BNA-CHK-003", "BNA-CHK-004", "BNA-CHK-005", "BNA-CHK-006", "BNA-CHK-007", "BNA-CHK-008", "BNA-CHK-009", "BNA-CHK-010"];
function check(){
  const id=document.getElementById('id').value.trim().toUpperCase();
  const r=document.getElementById('result');
  if(valid.includes(id)){
    r.className='result';
    r.innerHTML='<div class="valid">✓ ПРОПУСК ДЕЙСТВИТЕЛЕН</div><div style="margin-top:10px">ID: <b>'+id+'</b></div><div class="small">Статус: действителен</div>';
  }else{
    r.className='result';
    r.innerHTML='<div class="invalid">✕ ПРОПУСК НЕ НАЙДЕН</div><div class="small">Проверьте QR-код или ID пропуска.</div>';
  }
}
const p=new URLSearchParams(location.search);
const q=(p.get('id')||'').trim();
if(q){document.getElementById('id').value=q; check();}
</script>
</body></html>
